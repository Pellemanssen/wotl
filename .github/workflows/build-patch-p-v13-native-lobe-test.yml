name: Build patch-P v13 Native Lobe Test MPQ

on:
  push:
    branches: [work/a-little-extra-transfer]
    paths:
      - 'tools/m2_body_patch_v13_native_lobe.py'
      - '.github/workflows/build-patch-p-v13-native-lobe-test.yml'
  workflow_dispatch:

jobs:
  build-mpq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/a-little-extra-transfer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install StormLib MPQ utility
        run: |
          sudo apt-get update
          sudo apt-get install -y smpq
      - name: Generate v13 native-lobe models
        run: python tools/m2_body_patch_v13_native_lobe.py
      - name: Validate model safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('analysis/body_patch_v13_native_lobe_report.json'))
          for race,v in r['races'].items():
              print(race,'body chest changed',v['body_chest_changed'],'gear changed',v['replacement_chest_changed'],'apex',v['apex_mean_dx'],'shell',v['shell_mean_dx'])
              assert v['body_chest_changed'] > 0
              assert v['replacement_chest_changed'] == 0
              assert v['only_vertex_xy_changed'] is True
              assert v['z_unchanged'] is True
          PY
      - name: Create WotLK MPQ v1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mpqroot_v13 mpqextract_v13 patch-P.MPQ
          mkdir -p mpqroot_v13
          cp -a generated_v13_native_lobe/Character mpqroot_v13/
          cd mpqroot_v13
          mapfile -t files < <(find Character -type f | sort)
          smpq -c -M 1 -C ZLIB ../patch-P.MPQ "${files[@]}"
          cd ..
          smpq -i patch-P.MPQ | tee analysis/patch-P-v13-test-info.txt
          smpq -l patch-P.MPQ | tee analysis/patch-P-v13-test-list.txt
      - name: Validate archive and exact round-trip bytes
        shell: bash
        run: |
          set -euo pipefail
          for f in OrcFemale.m2 OrcFemale00.skin DraeneiFemale.m2 DraeneiFemale00.skin ScourgeFemale.m2 ScourgeFemale00.skin; do
            grep -qi "$f" analysis/patch-P-v13-test-list.txt || { echo "Missing from MPQ: $f"; exit 1; }
          done
          mkdir mpqextract_v13
          cd mpqextract_v13
          smpq -x ../patch-P.MPQ
          cd ..
          cmp generated_v13_native_lobe/Character/Orc/Female/OrcFemale.m2 mpqextract_v13/Character/Orc/Female/OrcFemale.m2
          cmp generated_v13_native_lobe/Character/Orc/Female/OrcFemale00.skin mpqextract_v13/Character/Orc/Female/OrcFemale00.skin
          cmp generated_v13_native_lobe/Character/Draenei/Female/DraeneiFemale.m2 mpqextract_v13/Character/Draenei/Female/DraeneiFemale.m2
          cmp generated_v13_native_lobe/Character/Draenei/Female/DraeneiFemale00.skin mpqextract_v13/Character/Draenei/Female/DraeneiFemale00.skin
          cmp generated_v13_native_lobe/Character/Scourge/Female/ScourgeFemale.m2 mpqextract_v13/Character/Scourge/Female/ScourgeFemale.m2
          cmp generated_v13_native_lobe/Character/Scourge/Female/ScourgeFemale00.skin mpqextract_v13/Character/Scourge/Female/ScourgeFemale00.skin
          sha256sum patch-P.MPQ | tee analysis/patch-P-v13-test.sha256
      - name: Upload ready-to-test patch
        uses: actions/upload-artifact@v4
        with:
          name: patch-P-WotLK-Extra-v13-NativeLobe-Test
          path: |
            patch-P.MPQ
            analysis/body_patch_v13_native_lobe_report.json
            analysis/patch-P-v13-test-info.txt
            analysis/patch-P-v13-test-list.txt
            analysis/patch-P-v13-test.sha256
          if-no-files-found: error
