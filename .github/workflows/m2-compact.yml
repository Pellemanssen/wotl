name: M2 compact summary

on:
  push:
    branches:
      - work/a-little-extra-transfer
    paths-ignore:
      - 'analysis/**'

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure diagnostic report
        run: python tools/m2_diagnose.py
      - name: Build compact report
        run: python tools/m2_compact_summary.py
      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/m2_report.json analysis/m2_report.md analysis/m2_compact.json
          git diff --cached --quiet && exit 0
          git commit -m "Update compact M2 body report"
          git push
