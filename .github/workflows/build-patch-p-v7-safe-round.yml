name: Build patch-P v7 Safe Round MPQ

on:
  push:
    branches: [work/a-little-extra-transfer]
    paths:
      - 'tools/m2_body_patch_v7_safe_round.py'
      - '.github/workflows/build-patch-p-v7-safe-round.yml'
  workflow_dispatch:

jobs:
  build-mpq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/a-little-extra-transfer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install StormLib MPQ utility
        run: |
          sudo apt-get update
          sudo apt-get install -y smpq
      - name: Generate v7 safe round models
        run: python tools/m2_body_patch_v7_safe_round.py
      - name: Create WotLK MPQ v1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mpqroot_v7 mpqextract_v7 patch-P.MPQ
          mkdir -p mpqroot_v7
          cp -a generated_v7_safe_round/Character mpqroot_v7/
          cd mpqroot_v7
          mapfile -t files < <(find Character -type f | sort)
          smpq -c -M 1 -C ZLIB ../patch-P.MPQ "${files[@]}"
          cd ..
          smpq -i patch-P.MPQ | tee analysis/patch-P-v7-info.txt
          smpq -l patch-P.MPQ | tee analysis/patch-P-v7-list.txt
      - name: Validate archive and round-trip bytes
        shell: bash
        run: |
          set -euo pipefail
          for f in OrcFemale.m2 OrcFemale00.skin DraeneiFemale.m2 DraeneiFemale00.skin ScourgeFemale.m2 ScourgeFemale00.skin; do
            grep -qi "$f" analysis/patch-P-v7-list.txt || { echo "Missing from MPQ: $f"; exit 1; }
          done
          mkdir mpqextract_v7
          cd mpqextract_v7
          smpq -x ../patch-P.MPQ
          cd ..
          cmp generated_v7_safe_round/Character/Orc/Female/OrcFemale.m2 mpqextract_v7/Character/Orc/Female/OrcFemale.m2
          cmp generated_v7_safe_round/Character/Orc/Female/OrcFemale00.skin mpqextract_v7/Character/Orc/Female/OrcFemale00.skin
          cmp generated_v7_safe_round/Character/Draenei/Female/DraeneiFemale.m2 mpqextract_v7/Character/Draenei/Female/DraeneiFemale.m2
          cmp generated_v7_safe_round/Character/Draenei/Female/DraeneiFemale00.skin mpqextract_v7/Character/Draenei/Female/DraeneiFemale00.skin
          cmp generated_v7_safe_round/Character/Scourge/Female/ScourgeFemale.m2 mpqextract_v7/Character/Scourge/Female/ScourgeFemale.m2
          cmp generated_v7_safe_round/Character/Scourge/Female/ScourgeFemale00.skin mpqextract_v7/Character/Scourge/Female/ScourgeFemale00.skin
          sha256sum patch-P.MPQ | tee analysis/patch-P-v7.sha256
      - name: Upload ready-to-test patch
        uses: actions/upload-artifact@v4
        with:
          name: patch-P-WotLK-Extra-v7-SafeRound
          path: |
            patch-P.MPQ
            analysis/body_patch_v7_safe_round_report.json
            analysis/patch-P-v7-info.txt
            analysis/patch-P-v7-list.txt
            analysis/patch-P-v7.sha256
          if-no-files-found: error
