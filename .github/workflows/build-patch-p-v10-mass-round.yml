name: Build patch-P v10 Mass Round MPQ

on:
  push:
    branches: [work/a-little-extra-transfer]
    paths:
      - 'tools/m2_body_patch_v10_mass_round.py'
      - '.github/workflows/build-patch-p-v10-mass-round.yml'
  workflow_dispatch:

jobs:
  build-mpq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/a-little-extra-transfer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install StormLib MPQ utility
        run: |
          sudo apt-get update
          sudo apt-get install -y smpq
      - name: Generate v10 mass-round models
        run: python tools/m2_body_patch_v10_mass_round.py
      - name: Validate model report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('analysis/body_patch_v10_mass_round_report.json'))
          for race,v in r['races'].items():
              print(race,'breast verts',v['breast_changed_vertices'],'dx',v['max_breast_dx'],'dy',v['max_breast_dy'])
              assert v['breast_below_chest_low']==0
              assert v['only_vertex_xy_changed'] is True
              assert v['z_unchanged'] is True
              assert v['breast_changed_vertices'] >= 60
          PY
      - name: Create WotLK MPQ v1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mpqroot_v10 mpqextract_v10 patch-P.MPQ
          mkdir -p mpqroot_v10
          cp -a generated_v10_mass_round/Character mpqroot_v10/
          cd mpqroot_v10
          mapfile -t files < <(find Character -type f | sort)
          smpq -c -M 1 -C ZLIB ../patch-P.MPQ "${files[@]}"
          cd ..
          smpq -i patch-P.MPQ | tee analysis/patch-P-v10-info.txt
          smpq -l patch-P.MPQ | tee analysis/patch-P-v10-list.txt
      - name: Validate archive and round-trip bytes
        shell: bash
        run: |
          set -euo pipefail
          for f in OrcFemale.m2 OrcFemale00.skin DraeneiFemale.m2 DraeneiFemale00.skin ScourgeFemale.m2 ScourgeFemale00.skin; do
            grep -qi "$f" analysis/patch-P-v10-list.txt || { echo "Missing from MPQ: $f"; exit 1; }
          done
          mkdir mpqextract_v10
          cd mpqextract_v10
          smpq -x ../patch-P.MPQ
          cd ..
          cmp generated_v10_mass_round/Character/Orc/Female/OrcFemale.m2 mpqextract_v10/Character/Orc/Female/OrcFemale.m2
          cmp generated_v10_mass_round/Character/Orc/Female/OrcFemale00.skin mpqextract_v10/Character/Orc/Female/OrcFemale00.skin
          cmp generated_v10_mass_round/Character/Draenei/Female/DraeneiFemale.m2 mpqextract_v10/Character/Draenei/Female/DraeneiFemale.m2
          cmp generated_v10_mass_round/Character/Draenei/Female/DraeneiFemale00.skin mpqextract_v10/Character/Draenei/Female/DraeneiFemale00.skin
          cmp generated_v10_mass_round/Character/Scourge/Female/ScourgeFemale.m2 mpqextract_v10/Character/Scourge/Female/ScourgeFemale.m2
          cmp generated_v10_mass_round/Character/Scourge/Female/ScourgeFemale00.skin mpqextract_v10/Character/Scourge/Female/ScourgeFemale00.skin
          sha256sum patch-P.MPQ | tee analysis/patch-P-v10.sha256
      - name: Upload ready-to-test patch
        uses: actions/upload-artifact@v4
        with:
          name: patch-P-WotLK-Extra-v10-MassRound
          path: |
            patch-P.MPQ
            analysis/body_patch_v10_mass_round_report.json
            analysis/patch-P-v10-info.txt
            analysis/patch-P-v10-list.txt
            analysis/patch-P-v10.sha256
          if-no-files-found: error
