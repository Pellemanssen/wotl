name: Build patch-P v15b Mass Surface MPQ

on:
  push:
    branches: [work/a-little-extra-transfer]
    paths:
      - 'tools/m2_body_patch_v15_mass_surface.py'
      - 'tools/m2_body_patch_v15b_mass_surface.py'
      - '.github/workflows/build-patch-p-v15b-mass-surface.yml'
  workflow_dispatch:

jobs:
  build-mpq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/a-little-extra-transfer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install StormLib MPQ utility
        run: |
          sudo apt-get update
          sudo apt-get install -y smpq
      - name: Generate v15b per-race mass-surface models
        run: python tools/m2_body_patch_v15b_mass_surface.py
      - name: Validate geometry safety and anti-tip behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('analysis/body_patch_v15_mass_surface_report.json'))
          for race,v in r['races'].items():
              print(race, 'mode',v['mode'], 'changed',v['body_chest_changed'], 'pos',v['body_positive_dx'], 'neg',v['body_negative_dx'], 'apex',v['apex_mean_dx'], 'shell',v['shell_mean_dx'])
              assert v['body_chest_changed'] > 0
              assert v['replacement_chest_changed'] == 0
              assert v['breast_below_chest_low'] == 0
              assert v['only_vertex_xy_changed'] is True
              assert v['z_unchanged'] is True
          for race in ('Orc','Scourge'):
              v=r['races'][race]
              assert v['shell_n'] >= 8
              assert v['body_negative_dx'] > 0, (race,'expected actual tip pullback')
              if v['apex_n']:
                  assert v['apex_mean_dx'] <= v['shell_mean_dx']*0.80 + 0.002, (race,v['apex_mean_dx'],v['shell_mean_dx'])
          d=r['races']['Draenei']
          assert d['body_positive_dx'] >= 70
          PY
      - name: Create WotLK MPQ v1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mpqroot_v15b mpqextract_v15b patch-P.MPQ
          mkdir -p mpqroot_v15b
          cp -a generated_v15b_mass_surface/Character mpqroot_v15b/
          cd mpqroot_v15b
          mapfile -t files < <(find Character -type f | sort)
          smpq -c -M 1 -C ZLIB ../patch-P.MPQ "${files[@]}"
          cd ..
          smpq -i patch-P.MPQ | tee analysis/patch-P-v15b-info.txt
          smpq -l patch-P.MPQ | tee analysis/patch-P-v15b-list.txt
      - name: Validate archive and exact round-trip bytes
        shell: bash
        run: |
          set -euo pipefail
          for f in OrcFemale.m2 OrcFemale00.skin DraeneiFemale.m2 DraeneiFemale00.skin ScourgeFemale.m2 ScourgeFemale00.skin; do
            grep -qi "$f" analysis/patch-P-v15b-list.txt || { echo "Missing from MPQ: $f"; exit 1; }
          done
          mkdir mpqextract_v15b
          cd mpqextract_v15b
          smpq -x ../patch-P.MPQ
          cd ..
          cmp generated_v15b_mass_surface/Character/Orc/Female/OrcFemale.m2 mpqextract_v15b/Character/Orc/Female/OrcFemale.m2
          cmp generated_v15b_mass_surface/Character/Orc/Female/OrcFemale00.skin mpqextract_v15b/Character/Orc/Female/OrcFemale00.skin
          cmp generated_v15b_mass_surface/Character/Draenei/Female/DraeneiFemale.m2 mpqextract_v15b/Character/Draenei/Female/DraeneiFemale.m2
          cmp generated_v15b_mass_surface/Character/Draenei/Female/DraeneiFemale00.skin mpqextract_v15b/Character/Draenei/Female/DraeneiFemale00.skin
          cmp generated_v15b_mass_surface/Character/Scourge/Female/ScourgeFemale.m2 mpqextract_v15b/Character/Scourge/Female/ScourgeFemale.m2
          cmp generated_v15b_mass_surface/Character/Scourge/Female/ScourgeFemale00.skin mpqextract_v15b/Character/Scourge/Female/ScourgeFemale00.skin
          sha256sum patch-P.MPQ | tee analysis/patch-P-v15b.sha256
      - name: Upload ready-to-test patch
        uses: actions/upload-artifact@v4
        with:
          name: patch-P-WotLK-Extra-v15b-MassSurface
          path: |
            patch-P.MPQ
            analysis/body_patch_v15_mass_surface_report.json
            analysis/patch-P-v15b-info.txt
            analysis/patch-P-v15b-list.txt
            analysis/patch-P-v15b.sha256
          if-no-files-found: error
