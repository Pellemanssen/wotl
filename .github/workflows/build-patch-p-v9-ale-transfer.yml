name: Build patch-P v9 ALE Transfer MPQ

on:
  push:
    branches: [work/a-little-extra-transfer]
    paths:
      - 'tools/m2_body_patch_v9_ale_transfer.py'
      - '.github/workflows/build-patch-p-v9-ale-transfer.yml'
  workflow_dispatch:

jobs:
  build-mpq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/a-little-extra-transfer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install StormLib MPQ utility
        run: |
          sudo apt-get update
          sudo apt-get install -y smpq
      - name: Generate v9 from Blood Elf ALE profile
        run: python tools/m2_body_patch_v9_ale_transfer.py
      - name: Validate ALE transfer report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('analysis/body_patch_v9_ale_transfer_report.json'))
          print('Reference:',r['reference'])
          for race,v in r['races'].items():
              print(race,'RMSE',v['ale_profile_rmse_before'],'->',v['ale_profile_rmse_after'],'breast verts',v['breast_changed_vertices'],'max dx',v['max_breast_dx'])
              assert v['breast_below_belly_lock']==0, (race,'belly leak')
              assert v['breast_changes_x_only'] is True
              assert v['only_vertex_xy_changed'] is True
              assert v['ale_profile_improved'] is True, (race,'ALE profile did not improve')
          PY
      - name: Create WotLK MPQ v1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mpqroot_v9 mpqextract_v9 patch-P.MPQ
          mkdir -p mpqroot_v9
          cp -a generated_v9_ale_transfer/Character mpqroot_v9/
          cd mpqroot_v9
          mapfile -t files < <(find Character -type f | sort)
          smpq -c -M 1 -C ZLIB ../patch-P.MPQ "${files[@]}"
          cd ..
          smpq -i patch-P.MPQ | tee analysis/patch-P-v9-info.txt
          smpq -l patch-P.MPQ | tee analysis/patch-P-v9-list.txt
      - name: Validate archive and round-trip bytes
        shell: bash
        run: |
          set -euo pipefail
          for f in OrcFemale.m2 OrcFemale00.skin DraeneiFemale.m2 DraeneiFemale00.skin ScourgeFemale.m2 ScourgeFemale00.skin; do
            grep -qi "$f" analysis/patch-P-v9-list.txt || { echo "Missing from MPQ: $f"; exit 1; }
          done
          mkdir mpqextract_v9
          cd mpqextract_v9
          smpq -x ../patch-P.MPQ
          cd ..
          cmp generated_v9_ale_transfer/Character/Orc/Female/OrcFemale.m2 mpqextract_v9/Character/Orc/Female/OrcFemale.m2
          cmp generated_v9_ale_transfer/Character/Orc/Female/OrcFemale00.skin mpqextract_v9/Character/Orc/Female/OrcFemale00.skin
          cmp generated_v9_ale_transfer/Character/Draenei/Female/DraeneiFemale.m2 mpqextract_v9/Character/Draenei/Female/DraeneiFemale.m2
          cmp generated_v9_ale_transfer/Character/Draenei/Female/DraeneiFemale00.skin mpqextract_v9/Character/Draenei/Female/DraeneiFemale00.skin
          cmp generated_v9_ale_transfer/Character/Scourge/Female/ScourgeFemale.m2 mpqextract_v9/Character/Scourge/Female/ScourgeFemale.m2
          cmp generated_v9_ale_transfer/Character/Scourge/Female/ScourgeFemale00.skin mpqextract_v9/Character/Scourge/Female/ScourgeFemale00.skin
          sha256sum patch-P.MPQ | tee analysis/patch-P-v9.sha256
      - name: Upload ready-to-test patch
        uses: actions/upload-artifact@v4
        with:
          name: patch-P-WotLK-Extra-v9-ALETransfer
          path: |
            patch-P.MPQ
            analysis/body_patch_v9_ale_transfer_report.json
            analysis/patch-P-v9-info.txt
            analysis/patch-P-v9-list.txt
            analysis/patch-P-v9.sha256
          if-no-files-found: error
