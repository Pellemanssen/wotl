name: M2 bone landmarks

on:
  push:
    branches:
      - work/a-little-extra-transfer
    paths-ignore:
      - 'analysis/**'

permissions:
  contents: write

jobs:
  bones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build bone landmark report
        run: python tools/m2_bone_summary.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/m2_bones.json
          git diff --cached --quiet && exit 0
          git commit -m "Update M2 skeleton landmarks"
          git push
